name: CD - Nexus to ECR + ECS

on:
  workflow_run:
    workflows: ["Node.js CICD"]
    types:
      - completed

jobs:
  promote-image:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: Agent-1

    steps:
      # ===============================
      # 1️⃣ LOGIN TO NEXUS
      # ===============================
      - name: Login to Nexus
        run: |
          echo "${{ secrets.NEXUS_PASSWORD }}" | docker login \
          http://${{ vars.NEXUS_HOST }} \
          -u "${{ secrets.NEXUS_USERNAME }}" --password-stdin

      # ===============================
      # 2️⃣ PULL IMAGES FROM NEXUS
      # ===============================
      - name: Pull backend image from Nexus
        run: docker pull ${{ vars.NEXUS_HOST }}/docker-hosted/backend:latest

      - name: Pull frontend image from Nexus
        run: docker pull ${{ vars.NEXUS_HOST }}/docker-hosted/frontend:latest

      # ===============================
      # 3️⃣ AWS AUTH
      # ===============================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # ===============================
      # 4️⃣ TERRAFORM BOOTSTRAP (ECR ONLY)
      # ===============================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        run: terraform init
        working-directory: ECS_terraform

      - name: Terraform Apply (Create ECR repos)
        run: |
          terraform apply -auto-approve \
            -target=aws_ecr_repository.backend \
            -target=aws_ecr_repository.frontend
        working-directory: ECS_terraform

      # ===============================
      # 5️⃣ LOGIN TO AWS ECR
      # ===============================
      - name: Login to AWS ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login \
          --username AWS \
          --password-stdin ${{ vars.aws_acc_id }}.dkr.ecr.us-east-1.amazonaws.com

      # ===============================
      # 6️⃣ TAG IMAGES FOR ECR
      # ===============================
      - name: Tag backend image
        run: |
          docker tag \
          ${{ vars.NEXUS_HOST }}/docker-hosted/backend:latest \
          ${{ vars.aws_acc_id }}.dkr.ecr.us-east-1.amazonaws.com/backend:latest

      - name: Tag frontend image
        run: |
          docker tag \
          ${{ vars.NEXUS_HOST }}/docker-hosted/frontend:latest \
          ${{ vars.aws_acc_id }}.dkr.ecr.us-east-1.amazonaws.com/frontend:latest

      # ===============================
      # 7️⃣ PUSH IMAGES TO ECR
      # ===============================
      - name: Push backend image to ECR
        run: docker push ${{ vars.aws_acc_id }}.dkr.ecr.us-east-1.amazonaws.com/backend:latest

      - name: Push frontend image to ECR
        run: docker push ${{ vars.aws_acc_id }}.dkr.ecr.us-east-1.amazonaws.com/frontend:latest

      # ===============================
      # 8️⃣ TERRAFORM APPLY (ECS + ALB)
      # ===============================
      - name: Terraform Validate
        run: terraform validate
        working-directory: ECS_terraform

      - name: Terraform Plan
        run: terraform plan
        working-directory: ECS_terraform

      - name: Terraform Apply (ECS Deploy)
        run: terraform apply -auto-approve
        working-directory: ECS_terraform
